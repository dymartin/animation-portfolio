<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Animations</title>

    <link rel="stylesheet" href="https://unpkg.com/98.css">
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>

    <link rel="stylesheet" href="css/desktop.css">
    <link rel="stylesheet" href="css/windows.css">
    <link rel="stylesheet" href="css/gallery.css">
</head>

<body>

    <div id="desktop">

        <div class="window page-window active-window" id="explorer-window">

            <div class="title-bar">
                <div class="title-bar-text">
                    Video Animations
                </div>

                <div class="title-bar-controls">
                    <button disabled aria-label="Minimize"></button>
                    <button disabled aria-label="Maximize"></button>
                    <button onclick="window.location='index.html';" aria-label="Close"></button>
                </div>
            </div>

            <nav class="menu-bar">
                <button>File</button>
                <button>Edit</button>
                <button>View</button>
                <button>Help</button>
            </nav>

            <div class="toolbar">
                <button onclick="window.location='index.html'">
                    <iconify-icon icon="mdi:arrow-left"></iconify-icon>
                    Back
                </button>

                <button disabled>
                    <iconify-icon icon="mdi:arrow-right"></iconify-icon>
                    Forward
                </button>

                <button onclick="location.reload()">
                    <iconify-icon icon="mdi:refresh"></iconify-icon>
                    Refresh
                </button>
            </div>

            <div class="address-bar">
                <label>Address</label>
                <input type="text" readonly value="C:\Portfolio\Video Animations">
            </div>

            <!-- SCROLLABLE CONTENT -->

            <div class="window-body">

                <div id="portfolio-gallery">

                    <!--
                gallery.js generates all projects here.
            -->

                </div>

            </div>

            <footer class="status-bar">
                <p class="status-bar-field">
                    Portfolio Gallery
                </p>

                <p class="status-bar-field">
                    C:\Portfolio\Video Animations
                </p>
            </footer>

        </div>

    </div>

    <footer id="taskbar">

        <button id="start-button">
            Start
        </button>

        <div id="taskbar-apps">

            <button class="taskbar-item">
                Portfolio
            </button>

            <button class="taskbar-item active">
                Video Animations
            </button>

        </div>

        <time id="clock">
            00:00
        </time>

    </footer>

    <script src="js/clock.js"></script>
    <script src="js/desktop.js"></script>

    <!-- project data -->
    <script src="data/animations.js"></script>

    <!-- generates the gallery -->
    <script src="js/gallery.js"></script>

</body>

</html>
